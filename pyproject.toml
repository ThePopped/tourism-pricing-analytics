[project]
name = "tourism_pricing_analytics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.58,<2",
    "beautifulsoup4>=4.12,<5",
    # Downstream analytics stack. Lower bounds only: Python 3.14 needs the
    # latest wheels (e.g. pandas resolves to 3.x, not 2.x), so upper caps are
    # intentionally omitted to keep resolution working on new interpreters.
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pyarrow>=16",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.58,<2",
    "beautifulsoup4>=4.12,<5",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pyarrow>=16",
    "shap>=0.45",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tourism_pricing_analytics*"]
