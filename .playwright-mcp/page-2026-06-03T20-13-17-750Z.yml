                  - paragraph [ref=e556]: Located near the sandy beach of Pirgos Psilonerou, the all-inclusive Solimar Aquamarine features an Olympic-size pool and a buffet restaurant surrounded by landscaped gardens. It offers spacious rooms with sea, pool or garden views. The air-conditioned rooms and suites at Solimar Aquamarine are tastefully decorated in soft tones, each with a private balcony. They have a living area with satellite TV and a private bathroom with bathtub and free toiletries. Free deck chairs and umbrellas are available by the pool area, which includes separate children’s section and showers. Solimar also features a tennis court, a mini golf course, gym and a large playground. Guests can enjoy Greek and international cuisine in buffet style at the on-site restaurant. Refreshing drinks, cocktails and snacks are offered at the poolside bar. Solimar Aquamarine is 13 km away from the scenic town of Chania and 25 km from Souda Airport. Wi-Fi is available in the common areas and private parking is provided free of charge.
