                - generic [ref=e1959]:
                  - paragraph [ref=e1960]: Company information
                  - generic [ref=e1961]: With more than 20 properties and counting all our hotels and apartments are perfectly positioned in some of Chania’s most iconic and desirable destinations. We constantly evolve with time and adapt our properties to ever-changing guest demands as we tirelessly upgrade our facilities and services while keeping our Cretan hospitality spirit alive. Elia Hotels Group features Central and Boutique Hotels, to Summer Retreats and Spacious Villas and Apartments. From budget hotels to luxurious apartments and from family hotels to adults only concept, each with its own original design and unique stories to tell. For every choice you make, we have a hotel or apartment with its own personality. Here, in Elia Hotels Group, we strive for excellence and our aim remains the same for every traveller. “To be a destination where our guest’s experience is beyond expectations and our name to become synonymous with hospitality”.
                  - paragraph [ref=e1962]: Property information
                  - generic [ref=e1963]: The “Elia Daliani Suites” is a restored traditional house in the heart of the old town of Chania. It is in one of the most popular and busiest spots of the town. Visitors have direct access to all the significant sights of the old town, like the Municipal Market, the Municipal Gallery, the Venetian harbor and can stroll around the alleys which take one on a journey through the centuries and the various civilizations that have influenced the island (Venetian, Turkish, Greek, and Arabic). The “Elia Daliani Suites” offers four suites, two with two rooms and two single roomed ones, which can accommodate 2-4 people. They are equipped with air conditioning units, fridge, satellite TV, safe box, Wi-Fi connection and an espresso coffee maker. The two roomed suites have their balconies overlooking Daliani street, where there are many restaurants serving mainly Cretan dishes. The single roomed suites have their balconies overlooking Tsouderon street (on the north entrance of the Municipal Market), which is full of shops. Any of our visitors wishing to have breakfast during their stay can do so at a small extra fee at the breakfast buffet served at the “Elia Bettolo"
